<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>


    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    #box-1{
        height: 50px;
        background-color: green;
        width: 20px;


        /* time */
        /* transition-duration: ms; */
        /* transition-duration: 2000ms; */
        /* transition-duration: 500ms; */
        /* transition-duration: 1s; */
        /* transition-duration: 0.7s; */
        /* transition-duration: 4s; */


        /* transition-timing-function: ease-in; -> Starts Slowly and speed up */
        /* transition-timing-function: ease-out; -> Starts Quick and slows down */
        /* transition-timing-function: ease-in-out; -> Start slowly, speed up, slow down end  */
        transition-timing-function: ease;

        transition: 5s;

    }

    #box-1:hover{
        width: 100%;
        background-color: red;
    }

</style>
<body>
    
    <div class="boxes" id="box-1"></div>

</body>
</html>
